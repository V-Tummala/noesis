<!DOCTYPE html>

<html lang="en">


<head>

<meta charset="UTF-8">

<title>Noesis - Login</title>

<link rel="stylesheet" href="/static/style.css">

</head>



<body>


<div class="form-container">


<h2>
Login to Noesis
</h2>



<form method="POST">


<label>
Email
</label>


<input
type="email"
name="email"
required>



<label>
Password
</label>


<input
type="password"
name="password"
required>



<button type="submit">
Login
</button>


</form>



<p>

Don't have an account?

<a href="/register">
Register
</a>

</p>



</div>


</body>


</html>
