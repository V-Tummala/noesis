<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Noesis - Upload</title>

    <link rel="stylesheet" href="/static/style.css">

</head>


<body>


<nav>

    <h1>Noesis</h1>

    <div>

        <a href="/library">Library</a>

        <a href="/logout">Logout</a>

    </div>

</nav>



<div class="form-container">


<h2>
Upload Resource
</h2>


<form 
method="POST"
enctype="multipart/form-data">



<label>
Title
</label>

<input

type="text"

name="title"

placeholder="Resource title"

required>



<label>
Description
</label>

<textarea

name="description"

placeholder="Brief description">

</textarea>



<label>
Subject
</label>


<select name="subject">


<option>
Maths
</option>


<option>
Physics
</option>


<option>
Other
</option>


</select>




<label>
Syllabus
</label>


<select name="syllabus">


<option>
ESAT
</option>


<option>
TMUA
</option>


<option>
Neither
</option>


</select>



<label>
File
</label>


<input

type="file"

name="file"

required>



<button type="submit">

Upload

</button>



</form>



</div>


</body>

</html>
